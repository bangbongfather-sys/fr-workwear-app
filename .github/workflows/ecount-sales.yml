# 이카운트 판매조회 로봇 — 맥이 꺼져 있어도 회사 앱 「판매 현황 › 최신 내역 반영하기」가 되게 한다.
#  - 회사 앱이 요청을 걸면 이 워크플로를 깨운다(workflow_dispatch). 정해진 시간에 저절로 돌지는 않는다.
#  - 이카운트 회사코드·아이디·비밀번호는 저장소 Settings › Secrets and variables › Actions 에만 둔다.
#  - 회사 앱과는 GitHub 가 발급하는 실행 증명(OIDC)으로 통신한다 — main 의 이 파일만 받아 준다.
#  - 이 저장소는 공개라 실행 기록도 공개된다. 로봇은 금액·거래처·화면 내용을 기록에 찍지 않는다.
name: 이카운트 판매조회 로봇
on:
  # 매일 아침(월~토 08:41) 점검 — 로그인해서 인증 창의 문자(SMS) 칸까지만 확인하고 멈춘다(문자는 보내지 않는다).
  # 이카운트 화면이 바뀌어 로봇이 막히면, 대표님이 누르기 전에 회사 앱에 「점검 실패」가 뜬다.
  schedule:
    - cron: "41 23 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 걸린 요청 처리 · authcheck = 인증 창 문자 칸까지 점검(문자 안 보냄) · selftest = 점검(로그인하지 않음)"
        type: choice
        options: [check, authcheck, selftest]
        default: check
permissions:
  contents: read
  id-token: write
# 동시에 두 번 깨워져도 괜찮다 — 회사 앱이 요청을 한 로봇에게만 내준다(다른 쪽은 「이미 처리 중」을 보고 끝).
# 줄 세우기(concurrency)를 걸면, 앞의 실행이 준비 단계에서 멈췄을 때 다시 깨운 실행까지 같이 묶여 버린다.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: ecount-relay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 준비 (브라우저 조종 도구)
        timeout-minutes: 3
        run: |
          cd ecount-relay
          npm init -y >/dev/null
          timeout 60 npm install --no-audit --no-fund --silent playwright-core@1.49.1 || timeout 90 npm install --no-audit --no-fund --silent playwright-core@1.49.1
      # 한글 글꼴은 화면 사진을 읽기 좋게 할 뿐이다(로봇은 글꼴 없이도 동작) — 기다리지 않고 뒤에서 깔리게 둔다.
      - name: 한글 글꼴 (뒤에서, 안 돼도 계속)
        continue-on-error: true
        run: nohup sudo timeout 25 apt-get install -y -qq fonts-nanum >/dev/null 2>&1 &
      - name: 로봇 실행
        env:
          MODE: ${{ github.event_name == 'schedule' && 'authcheck' || inputs.mode }}
          NJ_ECOUNT_COM: ${{ secrets.ECOUNT_COM_CODE }}
          NJ_ECOUNT_WEB_ID: ${{ secrets.ECOUNT_WEB_ID }}
          NJ_ECOUNT_WEB_PW: ${{ secrets.ECOUNT_WEB_PW }}
        run: |
          case "$MODE" in selftest) M=selftest ;; authcheck) M=authcheck ;; *) M=check ;; esac
          node ecount-relay/web.mjs "$M"
